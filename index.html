<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MathBook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#F5F7FC; --grid:rgba(52,84,200,.08); --card:#fff; --ink:#1A2140; --muted:#5A6384;
  --line:#D8DEEE; --blue:#2646D4; --blue-soft:#E4E9FC; --green:#1B8A57; --green-soft:#DDF3E8;
  --red:#D33F37; --red-soft:#FCE6E4; --mark:#FFE03D; --mark-ink:#3B3000;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#0F131D; --grid:rgba(130,150,255,.07); --card:#161B29; --ink:#E5E8F4; --muted:#98A1C0;
  --line:#272F47; --blue:#8098FF; --blue-soft:#1E2747; --green:#4CC48A; --green-soft:#16302A;
  --red:#FF6E64; --red-soft:#3A1E22; --mark:#F0CC2C; --mark-ink:#2A2200; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background-color:var(--paper);color:var(--ink);font:15px/1.5 "Golos Text",system-ui,sans-serif;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
button,input{font:inherit;color:inherit}
h1,h2,h3{font-family:"Unbounded","Golos Text",sans-serif;margin:0;line-height:1.2}
h1{font-size:1.5rem} h2{font-size:1.15rem}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{font-family:"Unbounded",sans-serif;font-weight:700;font-size:1.2rem;color:var(--blue)}
.cls{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.stack{display:grid;gap:16px}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--blue);border-color:var(--blue)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.4;cursor:default}
.inp{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px}
.inp:focus{outline:none;border-color:var(--blue)}
.muted{color:var(--muted)}
.err{color:var(--red);font-weight:600;min-height:1.4em}
.banner{background:var(--mark);color:var(--mark-ink);padding:10px 14px;border-radius:10px;font-size:.88rem;margin-bottom:16px}

.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab.on{background:var(--ink);color:var(--paper)}

.level{display:flex;align-items:center;gap:16px}
.level .n{font-family:"Unbounded",sans-serif;font-size:2.4rem;color:var(--blue);line-height:1}
.bar{height:10px;border-radius:6px;background:var(--blue-soft);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:6px;transition:width .6s}

.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.item .grow{flex:1;min-width:150px}
.item small{display:block;color:var(--muted)}
.tag{font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--green-soft);color:var(--green)}

.qcard{background:var(--card);border:1.5px solid var(--ink);border-radius:18px;padding:26px 20px;display:grid;gap:16px;text-align:center;box-shadow:5px 5px 0 var(--ink)}
.qnum{font-size:.8rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.q{font-size:clamp(1.3rem,5vw,1.9rem);font-weight:700;overflow-wrap:anywhere}
.text{text-align:left;background:var(--blue-soft);border-radius:12px;padding:14px 16px}
.af{display:flex;gap:8px;max-width:400px;width:100%;margin:0 auto}
.af .inp{flex:1;min-width:0;font-size:1.2rem;text-align:center}
.inp.ok{border-color:var(--green);background:var(--green-soft)} .inp.no{border-color:var(--red);background:var(--red-soft)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.choice{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px;cursor:pointer;font-weight:600}
.choice.ok{border-color:var(--green);background:var(--green-soft)} .choice.no{border-color:var(--red);background:var(--red-soft)}
.fb{font-weight:600;min-height:1.5em} .fb.ok{color:var(--green)} .fb.no{color:var(--red)}
.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.dots i{width:18px;height:7px;border-radius:4px;background:var(--line)}
.dots i.ok{background:var(--green)} .dots i.no{background:var(--red)}
.big{font-family:"Unbounded",sans-serif;font-size:3rem;color:var(--blue);line-height:1}
.xp{display:inline-block;background:var(--mark);color:var(--mark-ink);font-weight:700;padding:3px 10px;border-radius:8px}

.guest-tag{font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--mark);color:var(--mark-ink)}
.guest-note{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1.5px dashed var(--line);border-radius:12px;padding:12px 14px;background:var(--card)}
.guest-note p{margin:0;flex:1;min-width:200px;font-size:.9rem}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.linkbtn{border:0;background:none;color:var(--blue);font-weight:600;cursor:pointer;justify-self:center;padding:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:1.5rem}
.tile span{font-size:.82rem;color:var(--muted)}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:.9rem}
.tbl th,.tbl td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}
.tbl th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--blue-soft)}
.tbl tr.hist td{background:var(--paper);font-size:.85rem}
.tbl tr:last-child td{border-bottom:0}
.meter{display:flex;align-items:center;gap:8px}
.meter i{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:60px}
.meter i b{display:block;height:100%;border-radius:4px}
.lo{background:var(--red)} .mid{background:var(--mark)} .hi{background:var(--green)}
.msg{padding:10px 14px;border-radius:10px;font-weight:600}
.msg.ok{background:var(--green-soft);color:var(--green)} .msg.no{background:var(--red-soft);color:var(--red)}
.qrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.3fr) 36px;gap:6px}
@media (max-width:560px){.qrow{grid-template-columns:minmax(0,1fr) 36px}.qrow .inp:nth-child(2),.qrow .inp:nth-child(3){grid-column:1}}
.x{border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;color:var(--muted)}
.pin{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.1em}
.formrow{display:flex;gap:8px;flex-wrap:wrap}
.formrow .inp{flex:1;min-width:140px}
label.chk{display:flex;gap:8px;align-items:center;font-weight:600}
.rank{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.rank b.r{color:var(--muted);text-align:right}
.rank.me{border-color:var(--blue);background:var(--blue-soft)}
.rank.top1 b.r{color:var(--mark-ink);background:var(--mark);border-radius:6px;text-align:center}

/* анімація завантаження: символи «підстрибують», поки скрипт працює */
.loader{position:fixed;inset:0;background:color-mix(in srgb,var(--paper) 85%,transparent);display:grid;place-items:center;z-index:10}
.loader[hidden]{display:none}
.loader .box{display:grid;justify-items:center;gap:14px}
.syms{display:flex;gap:10px}
.syms span{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font:700 1.4rem "Unbounded",sans-serif;background:var(--ink);color:var(--paper);animation:hop 1s ease-in-out infinite}
.syms span:nth-child(2){animation-delay:.15s;background:var(--blue)}
.syms span:nth-child(3){animation-delay:.3s;background:var(--mark);color:var(--mark-ink)}
.syms span:nth-child(4){animation-delay:.45s}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-16px)}}
.loader p{font-weight:600;margin:0}
@media (prefers-reduced-motion:reduce){.syms span{animation-duration:3s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brand">MathBook</span><span class="cls" id="cls"></span>
    <div class="right" id="who"></div>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>
<div class="loader" id="loader" hidden><div class="box"><div class="syms"><span>+</span><span>−</span><span>×</span><span>=</span></div><p id="loaderText">Завантаження…</p></div></div>

<script>
/* ===== НАЛАШТУВАННЯ: вставте сюди адресу веб-застосунку Apps Script ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxlJOWWpLskz8TbCYHE7Ufq8iLDlzND5q0UqmNxITm1Ywi2Lrd3ADzmBbc4NFwJWMGrwA/exec';
/* ======================================================================= */

const LEVELS = [[0,'Новачок'],[100,'Учень'],[300,'Знавець'],[600,'Майстер'],[1000,'Експерт'],[1500,'Піфагор']];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- перевірка відповіді: 0,5 = 0.5 = 1/2 ---------- */
function toNum(s) {
  s = String(s).trim().replace(/\s+/g, '').replace(/,/g, '.').replace(/[−–]/g, '-');
  const m = s.match(/^(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)$/);
  if (m) return +m[2] ? +m[1] / +m[2] : NaN;
  return /^-?(\d+\.?\d*|\.\d+)$/.test(s) ? +s : NaN;
}
function isRight(given, answer) {
  return String(answer).split('|').some(alt => {
    const a = toNum(alt), b = toNum(given);
    if (!isNaN(a) && !isNaN(b)) return Math.abs(a - b) < 1e-9;
    return given.trim().toLowerCase() === alt.trim().toLowerCase();
  });
}
const firstAnswer = a => String(a).split('|')[0].trim();

/* ---------- вбудовані генератори прикладів ---------- */
const GENERATORS = {
  'Усний рахунок': () => { const a = ri(10, 90), b = ri(5, 60); return Math.random() < .5 && a > b ? { q: `${a} − ${b} = ?`, a: String(a - b) } : { q: `${a} + ${b} = ?`, a: String(a + b) }; },
  'Таблиця множення': () => { const a = ri(2, 10), b = ri(2, 10); return Math.random() < .3 ? { q: `${a * b} : ${a} = ?`, a: String(b) } : { q: `${a} × ${b} = ?`, a: String(a * b) }; },
  'Дроби': () => { const d = [2, 3, 4, 5, 10][ri(0, 4)], n = ri(1, d - 1), k = ri(2, 8); return { q: `${n}/${d} від ${d * k} = ?`, a: String(n * k) }; },
  'Рівняння': () => { const x = ri(1, 12), a = ri(1, 5), b = ri(1, 15); return { q: `${a === 1 ? '' : a}x + ${b} = ${a * x + b}.  x = ?`, a: String(x) }; },
};

/* ---------- стан ---------- */
let data = null;          // усе з таблиці: клас, учні, тренажери, уроки, рейтинг
let me = null;            // { name, pin, xp, done }
let tab = 'home';
let game = null;          // поточний тренажер або урок
let loginMode = 'student'; // 'student' або 'teacher' — яку форму входу показати
let teacher = null;       // кабінет вчителя: { password, d, tab, open, showPins, confirm, builder, msg }

/* ---------- режим гостя: бали лише в цьому браузері, у рейтинг не йдуть ---------- */
function loadGuest() { try { return JSON.parse(localStorage.getItem('mb-guest') || 'null') || { xp: 0, done: [] }; } catch (e) { return { xp: 0, done: [] }; } }
function saveGuest() { try { localStorage.setItem('mb-guest', JSON.stringify({ xp: me.xp, done: me.done })); } catch (e) {} }
function enterGuest() {
  me = { guest: true, name: 'Гість', ...loadGuest() };
  try { localStorage.setItem('mb-me', JSON.stringify({ guest: true })); } catch (e) {}
  render();
}

/* ---------- зв'язок із таблицею ---------- */
async function api(action, payload = {}) {
  if (!API_URL) return demoApi(action, payload);
  if (action === 'init') return (await fetch(API_URL + '?action=init')).json();
  // text/plain (за замовчуванням) — щоб Google не вимагав додаткових дозволів CORS
  return (await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, ...payload }) })).json();
}
async function withLoader(text, fn) {
  $('#loaderText').textContent = text;
  $('#loader').hidden = false;
  try { return await fn(); }
  catch (e) { alert('Немає зв’язку з таблицею. Перевірте інтернет і спробуйте ще раз.'); throw e; }
  finally { $('#loader').hidden = true; }
}

/* ---------- демо-режим, поки API_URL порожній ---------- */
const DEMO = {
  className: 'Демо-клас', xpPerAnswer: 10, guestMode: true, password: 'вчитель',
  students: [{ name: 'Оля К.', pin: '1234' }, { name: 'Петро С.', pin: '5678' }],
  trainers: [{ name: 'Периметр і площа', questions: [
    { q: 'Периметр квадрата зі стороною 6 см', a: '24', wrong: [] },
    { q: 'Площа прямокутника 4 см × 7 см', a: '28', wrong: ['22', '11', '47'] },
    { q: 'Скільки см² в 1 дм²?', a: '100', wrong: ['10', '1000'] }] }],
  lessons: [{ name: 'Що таке дріб', steps: [
    { text: 'Дріб показує, на скільки рівних частин поділили ціле (знаменник — нижнє число) і скільки частин узяли (чисельник — верхнє).', q: 'Піцу поділили на 8 шматків, з’їли 3. Який дріб піци з’їли?', a: '3/8' },
    { text: 'Щоб знайти дріб від числа, ділимо на знаменник і множимо на чисельник: 3/4 від 20 = 15.', q: 'Скільки буде 2/5 від 30?', a: '12' }] }],
};
const daysAgo = n => new Date(Date.now() - n * 864e5).toISOString();
const DEMO_SEED = [ // приклад історії, щоб у демо-кабінеті вчителя було що показати
  { date: daysAgo(2), name: 'Оля К.', trainer: 'Таблиця множення', correct: 9, total: 10, xp: 90 },
  { date: daysAgo(1), name: 'Петро С.', trainer: 'Периметр і площа', correct: 1, total: 3, xp: 10 },
  { date: daysAgo(0), name: 'Оля К.', trainer: 'Дроби', correct: 6, total: 10, xp: 60 },
];
function demoResults() { try { const v = localStorage.getItem('mb-demo'); return v ? JSON.parse(v) : DEMO_SEED; } catch (e) { return DEMO_SEED; } }
function demoRating() {
  const xp = Object.fromEntries(DEMO.students.map(s => [s.name, 0]));
  demoResults().forEach(r => { if (r.name in xp) xp[r.name] += r.xp; });
  return Object.entries(xp).map(([name, xp]) => ({ name, xp })).sort((a, b) => b.xp - a.xp);
}
async function demoApi(action, p) {
  await new Promise(r => setTimeout(r, 900)); // імітуємо затримку Google
  const ok = DEMO.students.some(s => s.name === p.name && s.pin === String(p.pin).trim());
  const info = name => ({ xp: demoRating().find(r => r.name === name)?.xp || 0, done: [...new Set(demoResults().filter(r => r.name === name).map(r => r.trainer))] });
  if (action === 'init') return { ok: true, ...DEMO, password: undefined, students: DEMO.students.map(s => s.name), rating: demoRating() };
  if (action === 'teacher') return demoTeacher(p);
  if (!ok) return { ok: false, error: 'Неправильне ім’я або PIN' };
  if (action === 'login') return { ok: true, name: p.name, ...info(p.name) };
  if (action === 'result') {
    const xp = Math.min(p.correct, p.total) * DEMO.xpPerAnswer;
    localStorage.setItem('mb-demo', JSON.stringify([...demoResults(), { date: new Date().toISOString(), name: p.name, trainer: p.trainer, correct: Math.min(p.correct, p.total), total: p.total, xp }]));
    return { ok: true, gained: xp, ...info(p.name), rating: demoRating() };
  }
}

/* ---------- рівні ---------- */
function levelOf(xp) {
  let i = 0; while (i + 1 < LEVELS.length && xp >= LEVELS[i + 1][0]) i++;
  const next = LEVELS[i + 1];
  return { n: i + 1, name: LEVELS[i][1], next, pct: next ? (xp - LEVELS[i][0]) / (next[0] - LEVELS[i][0]) : 1 };
}

/* ---------- екрани ---------- */
function render() {
  $('#cls').textContent = data ? data.className : '';
  $('#banner').innerHTML = API_URL ? '' : '<div class="banner"><b>Демо-режим.</b> Вставте адресу Apps Script у <code>API_URL</code>, щоб підключити Google Таблицю. Учень: Оля К., PIN 1234. Вчитель: пароль «вчитель».</div>';
  $('#who').innerHTML = teacher ? `<span class="guest-tag">Вчитель</span><button class="btn ghost sm" onclick="teacherLogout()">Вийти</button>` : !me ? '' : me.guest
    ? `<span class="guest-tag">Гість</span><button class="btn ghost sm" onclick="logout()">Увійти з PIN</button>`
    : `<span class="muted">${esc(me.name)}</span><button class="btn ghost sm" onclick="logout()">Вийти</button>`;
  const m = $('#main');
  if (!data) { m.innerHTML = ''; return; }
  if (teacher) { m.innerHTML = teacherView(); bindTeacher(); return; }
  if (!me) { m.innerHTML = loginMode === 'teacher' ? teacherLoginView() : loginView(); return; }
  if (game) { m.innerHTML = game.done ? resultView() : gameView(); bindGame(); return; }
  const tabs = [['home', 'Головна'], ['trainers', 'Тренажери'], ['lessons', 'Уроки'], ['rating', 'Рейтинг']];
  m.innerHTML = `<div class="stack"><nav class="tabs">${tabs.map(([k, l]) => `<button class="tab ${tab === k ? 'on' : ''}" onclick="setTab('${k}')">${l}</button>`).join('')}</nav>
    ${{ home: homeView, trainers: trainersView, lessons: lessonsView, rating: ratingView }[tab]()}</div>`;
}
function setTab(t) { tab = t; render(); }

function loginView() {
  return `<div class="card stack" style="max-width:420px;margin:30px auto">
    <h1>Привіт!</h1><p class="muted">Обери своє ім’я і введи PIN, який дав учитель.</p>
    <select class="inp" id="name"><option value="">— Твоє ім’я —</option>${data.students.map(s => `<option>${esc(s)}</option>`).join('')}</select>
    <input class="inp" id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off">
    <div class="err" id="err"></div>
    <button class="btn" onclick="login()">Увійти</button>
    ${data.guestMode ? `<div class="or"><span>або</span></div>
    <button class="btn ghost" onclick="enterGuest()">Спробувати як гість</button>
    <p class="muted" style="margin:0;font-size:.85rem">Гість може проходити тренажери й уроки, але його бали не потрапляють у рейтинг класу.</p>` : ''}
    <button class="linkbtn" onclick="loginMode='teacher';render()">Я вчитель →</button></div>`;
}
async function login() {
  const name = $('#name').value, pin = $('#pin').value.trim();
  if (!name || !pin) { $('#err').textContent = 'Обери ім’я і введи PIN.'; return; }
  const r = await withLoader('Шукаю твою книжку…', () => api('login', { name, pin }));
  if (!r.ok) { $('#err').textContent = r.error; return; }
  me = { name, pin, xp: r.xp, done: r.done };
  localStorage.setItem('mb-me', JSON.stringify({ name, pin }));
  render();
}
function logout() { me = null; game = null; localStorage.removeItem('mb-me'); render(); }

function guestNote() {

/* ---------- тренажер і урок ---------- */
function startTrainer(i) {
  const t = data.trainers[i];
  game = { title: t.name, items: shuffle(t.questions.map(q => ({ ...q, choices: q.wrong.length ? shuffle([firstAnswer(q.a), ...q.wrong]) : null }))), i: 0, results: [] };
  render();
}
function startGen(name) {
  game = { title: name, items: Array.from({ length: 10 }, GENERATORS[name]), i: 0, results: [] };
  render();
}
function startLesson(i) {
  const l = data.lessons[i];
  game = { title: 'Урок: ' + l.name, lesson: true, items: l.steps.map(s => ({ text: s.text, q: s.q, a: s.a })), i: 0, results: [] };
  render();
}
function gameView() {
  const it = game.items[game.i];
  return `<div class="stack"><div class="top" style="margin:0"><button class="btn ghost sm" onclick="quit()">← Назад</button><b>${esc(game.title)}</b></div>
    <div class="dots">${game.items.map((_, k) => `<i class="${game.results[k] === true ? 'ok' : game.results[k] === false ? 'no' : ''}"></i>`).join('')}</div>
    <div class="qcard"><div class="qnum">${game.lesson ? 'Крок' : 'Питання'} ${game.i + 1} з ${game.items.length}</div>
      ${it.text ? `<div class="text">${esc(it.text)}</div>` : ''}
      <div class="q">${esc(it.q)}</div>
      ${it.choices ? `<div class="choices">${it.choices.map(c => `<button class="choice">${esc(c)}</button>`).join('')}</div>`
        : `<form class="af" id="af"><input class="inp" id="ans" autocomplete="off" placeholder="Відповідь"><button class="btn">OK</button></form>`}
      <div class="fb" id="fb"></div>
      <div><button class="btn" id="next" hidden onclick="next()">${game.i + 1 < game.items.length ? 'Далі →' : 'Завершити'}</button></div></div></div>`;
}
function bindGame() {
  if (game.done) return;
  const it = game.items[game.i];
  const af = $('#af');
  if (af) { $('#ans').focus(); af.onsubmit = e => { e.preventDefault(); const v = $('#ans').value; if (v.trim()) answer(v); }; }
  document.querySelectorAll('.choice').forEach(b => b.onclick = () => answer(b.textContent, b));
}
function answer(value, btn) {
  if (game.results[game.i] !== undefined && !game.lesson) return;
  const it = game.items[game.i], ok = isRight(value, it.a), fb = $('#fb');
  if (game.lesson && !ok) { // в уроці можна пробувати ще, поки не вийде
    fb.textContent = 'Ще не так. Перечитай пояснення і спробуй ще раз.'; fb.className = 'fb no';
    if (btn) btn.classList.add('no'); else $('#ans').classList.add('no');
    if (game.results[game.i] === undefined) game.results[game.i] = false;
    return;
  }
  if (game.results[game.i] === undefined) game.results[game.i] = ok;
  fb.textContent = ok ? 'Правильно!' : `Ні. Правильна відповідь: ${firstAnswer(it.a)}`; fb.className = 'fb ' + (ok ? 'ok' : 'no');
  if (btn) { btn.classList.add(ok ? 'ok' : 'no'); document.querySelectorAll('.choice').forEach(b => b.disabled = true); }
  else { $('#ans').className = 'inp ' + (ok ? 'ok' : 'no'); $('#ans').disabled = true; }
  $('#next').hidden = false; $('#next').focus();
}
async function next() {
  if (game.i + 1 < game.items.length) { game.i++; render(); return; }
  const correct = game.results.filter(Boolean).length, total = game.items.length;
  const before = levelOf(me.xp).n;
  if (me.guest) {
    const gained = correct * data.xpPerAnswer;
    me.xp += gained;
    if (!me.done.includes(game.title)) me.done.push(game.title);
    saveGuest();
    game.done = { correct, total, gained, levelUp: levelOf(me.xp).n > before };
    render();
    return;
  }
  const r = await withLoader('Записую результат у журнал…', () => api('result', { name: me.name, pin: me.pin, trainer: game.title, correct, total }));
  if (!r.ok) { alert(r.error); return; }
  me.xp = r.xp; me.done = r.done; data.rating = r.rating;
  game.done = { correct, total, gained: r.gained, levelUp: levelOf(me.xp).n > before };
  render();
}
function resultView() {
  const d = game.done;
  return `<div class="qcard"><div class="qnum">${esc(game.title)}</div>
    <div class="big">${d.correct}/${d.total}</div>
    <h2>${d.correct === d.total ? 'Бездоганно!' : d.correct / d.total >= .7 ? 'Добра робота!' : 'Варто потренуватися ще'}</h2>
    <div><span class="xp">+${d.gained} XP</span></div>
    ${d.levelUp ? `<p><b>Новий рівень: ${levelOf(me.xp).name}!</b></p>` : ''}
    ${me.guest ? '<p class="muted" style="margin:0">Ти в режимі гостя, тому бали не записані в рейтинг класу.</p>' : ''}
    <div><button class="btn" onclick="quit()">Готово</button></div></div>`;
}
function quit() { const back = game && game.lesson ? 'lessons' : 'trainers'; game = null; tab = back; render(); }

async function teacherLogin(saved) {
  const password = saved || $('#tpass').value.trim();
  if (!password) { $('#err').textContent = 'Введіть пароль.'; return; }
  const r = await withLoader('Відкриваю кабінет…', () => api('teacher', { password, op: 'login' }));
  if (!r.ok) { if (saved) { sessionStorage.removeItem('mb-teacher'); render(); } else $('#err').textContent = r.error; return; }
  teacher = { password, d: r, tab: 'overview', open: null, showPins: false, confirm: null, builder: newBuilder(), msg: null };
  try { sessionStorage.setItem('mb-teacher', password); } catch (e) {} // лише до закриття вкладки
  render();
}
async function teacherLogout() {
  teacher = null; loginMode = 'student';
  try { sessionStorage.removeItem('mb-teacher'); } catch (e) {}
  data = await withLoader('Оновлюю дані…', () => api('init')); // зміни вчителя одразу видно учням
  render();
}
async function tDo(op, payload, loaderText, okText) {
  const r = await withLoader(loaderText, () => api('teacher', { password: teacher.password, op, ...payload }));
  if (!r.ok) { teacher.msg = { ok: false, text: r.error }; render(); return false; }
  teacher.d = r; teacher.confirm = null; teacher.msg = okText ? { ok: true, text: okText } : null;
  render(); return true;
}
function tTab(t) { teacher.tab = t; teacher.msg = null; teacher.confirm = null; render(); }

const dayKey = d => { const x = new Date(d); return isNaN(x) ? '' : x.toDateString(); };
function fmtDate(d) {
  const x = new Date(d); if (!d || isNaN(x)) return '—';
  if (dayKey(x) === new Date().toDateString()) return 'сьогодні, ' + x.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
  return x.toLocaleDateString('uk-UA', { day: 'numeric', month: 'short' });
}
function meter(pct) {
  const cls = pct < 50 ? 'lo' : pct < 75 ? 'mid' : 'hi';
  return `<span class="meter"><i><b class="${cls}" style="width:${pct}%"></b></i><span>${pct}%</span></span>`;
}
function tStats() {
  const d = teacher.d, per = {};
  d.students.forEach(s => per[s.name] = { name: s.name, xp: 0, attempts: 0, correct: 0, total: 0, last: '', hist: [] });
  const topics = {};
  d.results.forEach(r => {
    const p = per[r.name]; if (!p) return; // результати видалених учнів не рахуємо
    p.xp += r.xp; p.attempts++; p.correct += r.correct; p.total += r.total; p.hist.push(r);
    if (r.date && (!p.last || new Date(r.date) > new Date(p.last))) p.last = r.date;
    const t = topics[r.trainer] || (topics[r.trainer] = { name: r.trainer, attempts: 0, correct: 0, total: 0 });
    t.attempts++; t.correct += r.correct; t.total += r.total;
  });
  const students = Object.values(per).sort((a, b) => b.xp - a.xp);
  const pct = (c, t) => t ? Math.round(c / t * 100) : 0;
  const today = new Date().toDateString();
  const sumC = students.reduce((s, p) => s + p.correct, 0), sumT = students.reduce((s, p) => s + p.total, 0);
  return {
    students, pct,
    topics: Object.values(topics).map(t => ({ ...t, pct: pct(t.correct, t.total) })).sort((a, b) => a.pct - b.pct),
    activeToday: students.filter(p => dayKey(p.last) === today).length,
    solved: sumC, accuracy: pct(sumC, sumT),
  };
}

function teacherView() {
  const tabs = [['overview', 'Огляд'], ['students', 'Учні'], ['trainers', 'Тренажери'], ['settings', 'Налаштування']];
  const m = teacher.msg;
  return `<div class="stack"><nav class="tabs">${tabs.map(([k, l]) => `<button class="tab ${teacher.tab === k ? 'on' : ''}" onclick="tTab('${k}')">${l}</button>`).join('')}</nav>
    ${m ? `<div class="msg ${m.ok ? 'ok' : 'no'}">${esc(m.text)}</div>` : ''}
    ${{ overview: tOverview, students: tStudents, trainers: tTrainers, settings: tSettings }[teacher.tab]()}</div>`;
}

function tOverview() {
  const S = tStats();
  const rows = S.students.map(p => {
    const open = teacher.open === p.name;
    const hist = open ? `<tr class="hist"><td colspan="6">${p.hist.length ? p.hist.slice(-15).reverse().map(r =>
      `${fmtDate(r.date)} · <b>${esc(r.trainer)}</b> · ${r.correct}/${r.total} · +${r.xp} XP`).join('<br>') : 'Ще нічого не проходив.'}</td></tr>` : '';
    return `<tr class="click" onclick="teacher.open=${open ? 'null' : esc(JSON.stringify(p.name))};render()">
      <td>${open ? '▾' : '▸'} ${esc(p.name)}</td><td class="n">${p.xp}</td><td>${levelOf(p.xp).name}</td><td class="n">${p.attempts}</td>
      <td>${p.total ? meter(S.pct(p.correct, p.total)) : '—'}</td><td>${fmtDate(p.last)}</td></tr>${hist}`;
  }).join('');
  return `<div class="tiles">
      <div class="tile"><b>${S.students.length}</b><span>учнів у класі</span></div>
      <div class="tile"><b>${S.activeToday}</b><span>займалися сьогодні</span></div>
      <div class="tile"><b>${S.solved}</b><span>правильних відповідей</span></div>
      <div class="tile"><b>${S.accuracy}%</b><span>середня точність</span></div></div>
    <div class="top" style="margin:0"><h2>Учні</h2><div class="right"><button class="btn ghost sm" onclick="tDo('overview',{},'Оновлюю…')">Оновити</button></div></div>
    <p class="muted" style="margin:-8px 0 0;font-size:.85rem">Натисніть на учня, щоб побачити його історію.</p>
    ${S.students.length ? `<div class="tbl"><table><thead><tr><th>Учень</th><th class="n">XP</th><th>Рівень</th><th class="n">Спроб</th><th>Точність</th><th>Останній раз</th></tr></thead><tbody>${rows}</tbody></table></div>`
      : '<p class="muted">Учнів ще немає. Додайте їх на вкладці «Учні».</p>'}
    <h2>Найважчі теми</h2>
    ${S.topics.length ? `<div class="tbl"><table><thead><tr><th>Тренажер або урок</th><th class="n">Спроб</th><th>Середній результат</th></tr></thead><tbody>
      ${S.topics.map(t => `<tr><td>${esc(t.name)}</td><td class="n">${t.attempts}</td><td>${meter(t.pct)}</td></tr>`).join('')}</tbody></table></div>`
      : '<p class="muted">Тут з’явиться статистика, коли учні пройдуть перші тренажери.</p>'}`;
}

async function addStudent() {
  const name = $('#sname').value.trim(), pin = $('#spin').value.trim();

  teacher.showPins = true; render(); // одразу видно PIN нового учня
}

function newBuilder() { return { name: '', rows: [{ q: '', a: '', wrong: '' }, { q: '', a: '', wrong: '' }, { q: '', a: '', wrong: '' }] }; }
function readBuilder() {
  const b = teacher.builder, n = $('#tname'); if (!n) return;

  b.rows = [...document.querySelectorAll('.qrow')].map(r => ({ q: r.children[0].value, a: r.children[1].value, wrong: r.children[2].value }));

  return `<div class="card stack"><h2>Новий тренажер</h2>

        : `<button class="btn ghost sm" onclick="teacher.confirm=${esc(JSON.stringify('t:' + t.name))};render()">Видалити</button>`}</div>`).join('') || '<p class="muted">Ще немає тренажерів.</p>'}</div>
    <p class="muted" style="font-size:.85rem">Уроки поки редагуються прямо в таблиці, на аркуші «Уроки».</p>`;

async function saveTrainer() {
  readBuilder();
  const b = teacher.builder, questions = b.rows.filter(r => r.q.trim() && r.a.trim());
  if (!b.name.trim()) { teacher.msg = { ok: false, text: 'Вкажіть назву тренажера.' }; render(); return; }
  if (!questions.length) { teacher.msg = { ok: false, text: 'Додайте хоча б одне питання з відповіддю.' }; render(); return; }
  const name = b.name.trim();
  if (await tDo('addTrainer', { name, questions }, 'Записую тренажер у таблицю…', `Тренажер «${name}» опубліковано.`)) { teacher.builder = newBuilder(); render(); }
}

    <label class="chk"><input type="checkbox" id="sGuest" ${s.guestMode ? 'checked' : ''}> Дозволити режим гостя</label>
    <label class="stack" style="gap:4px"><b>Новий пароль вчителя</b><input class="inp" id="sPass" type="password" autocomplete="new-password" placeholder="Залиште порожнім, щоб не змінювати">
      <span class="muted" style="font-size:.82rem">Щонайменше 6 символів.</span></label>
    <div><button class="btn" onclick="saveSettings()">Зберегти</button></div></div>`;
}
async function saveSettings() {
  const newPassword = $('#sPass').value.trim();
  if (newPassword && newPassword.length < 6) { teacher.msg = { ok: false, text: 'Пароль має бути щонайменше 6 символів.' }; render(); return; }
  const payload = { className: $('#sClass').value.trim(), xpPerAnswer: +$('#sXp').value || 10, guestMode: $('#sGuest').checked, newPassword };
  if (await tDo('saveSettings', payload, 'Зберігаю…', 'Налаштування збережено.') && newPassword) {
    teacher.password = newPassword; try { sessionStorage.setItem('mb-teacher', newPassword); } catch (e) {}
  }
}
function bindTeacher() {}

/* демо-версія кабінету (без таблиці) — зміни живуть до перезавантаження сторінки */
function demoTeacher(p) {
  if (p.password !== DEMO.password) return { ok: false, error: 'Неправильний пароль' };
  const err = e => ({ ok: false, error: e });
  if (p.op === 'addStudent') {
    if (!p.name) return err('Вкажіть ім’я учня');
    if (DEMO.students.some(s => s.name === p.name)) return err('Учень з таким ім’ям уже є');
    if (p.pin && !/^\d{4,6}$/.test(p.pin)) return err('PIN — це 4–6 цифр');
    DEMO.students.push({ name: p.name, pin: p.pin || String(ri(1000, 9999)) });
  }
  if (p.op === 'deleteStudent') DEMO.students = DEMO.students.filter(s => s.name !== p.name);
  if (p.op === 'addTrainer') {
    if (DEMO.trainers.some(t => t.name === p.name)) return err('Тренажер з такою назвою вже є');
    DEMO.trainers.push({ name: p.name, questions: p.questions.map(q => ({ q: q.q, a: q.a, wrong: q.wrong.split(',').map(x => x.trim()).filter(Boolean) })) });
  }
  if (p.op === 'deleteTrainer') DEMO.trainers = DEMO.trainers.filter(t => t.name !== p.name);
  if (p.op === 'saveSettings') {
    if (p.className) DEMO.className = p.className;
    DEMO.xpPerAnswer = p.xpPerAnswer; DEMO.guestMode = p.guestMode;
    if (p.newPassword) DEMO.password = p.newPassword;
  }
  return { ok: true, settings: { className: DEMO.className, xpPerAnswer: DEMO.xpPerAnswer, guestMode: DEMO.guestMode },
    students: DEMO.students, results: demoResults(), trainers: DEMO.trainers };
}

/* ---------- запуск ---------- */
(async function start() {
  data = await withLoader('Відкриваю MathBook…', () => api('init'));
  let tpass = null;
  try { tpass = sessionStorage.getItem('mb-teacher'); } catch (e) {}
  if (tpass) { await teacherLogin(tpass); if (teacher) return; }
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem('mb-me') || 'null'); } catch (e) {}
  if (saved && saved.guest && data.guestMode) me = { guest: true, name: 'Гість', ...loadGuest() };
  else if (saved && data.students.includes(saved.name)) {
    const r = await withLoader('Шукаю твою книжку…', () => api('login', saved));
    if (r.ok) me = { ...saved, xp: r.xp, done: r.done };
  }
  render();
})();
</script>
